name: Init Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate PKCS12 keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/nova-release.jks \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -alias nova \
            -storepass nova123456 \
            -keypass nova123456 \
            -dname "CN=Nova, OU=Mobile, O=Nova, L=Beijing, ST=Beijing, C=CN"

      - name: Show fingerprint
        run: keytool -list -v -keystore out/nova-release.jks -storepass nova123456 | grep -E "SHA1:|SHA256:|Alias name|Valid from"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: nova-keystore
          path: out/nova-release.jks
          retention-days: 1
