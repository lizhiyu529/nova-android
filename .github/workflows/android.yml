name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing keystore on first build
        run: |
          mkdir -p keystore
          if [ ! -f keystore/nova-release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/nova-release.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias nova \
              -storepass nova123456 \
              -keypass nova123456 \
              -dname "CN=Nova, OU=Mobile, O=Nova, L=Beijing, S=Beijing, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/nova-release.jks
            git commit -m "chore: add release signing keystore"
            git push
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          NOVA_GITHUB_TOKEN: ${{ secrets.NOVA_GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK: $APK"
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/apksigner" verify "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
